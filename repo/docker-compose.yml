services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: notedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/notedb
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: your-super-secret-key
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
